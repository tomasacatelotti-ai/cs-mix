name: bootstrap
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate templates
        run: |
          mkdir out && cd out
          flutter --version > flutter-version.txt
          flutter create --org com.catelottisport --project-name cs_mix --platforms android,windows cs_mix
          flutter create --template=plugin_ffi --org com.catelottisport --platforms android,windows cs_audio
          rm -rf cs_mix/build cs_audio/build cs_mix/.dart_tool cs_audio/.dart_tool cs_audio/example
      - name: Push to scaffold branch
        run: |
          cd out
          git init -q -b scaffold
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A -f
          git commit -qm "scaffold"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" scaffold
