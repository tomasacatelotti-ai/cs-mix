name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.9
  APP_VERSION: 0.1.${{ github.run_number }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze (errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test

  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - run: flutter pub get
      - name: Build APK (retries when Gradle downloads time out)
        shell: bash
        run: |
          for i in 1 2 3; do
            flutter build apk --release --build-name=${{ env.APP_VERSION }} --build-number=${{ github.run_number }} && exit 0
            echo "Intento $i falló, reintento en 30 s"; sleep 30
          done
          exit 1
      - run: mv build/app/outputs/flutter-apk/app-release.apk "CS-Mix-${{ env.APP_VERSION }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: CS-Mix-*.apk

  windows:
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-name=${{ env.APP_VERSION }} --build-number=${{ github.run_number }}
      - name: Zip
        shell: pwsh
        run: |
          $out = "CS Mix"
          Copy-Item -Recurse build/windows/x64/runner/Release $out
          Compress-Archive -Path $out -DestinationPath "CS-Mix-Windows-${{ env.APP_VERSION }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: CS-Mix-Windows-*.zip

  windows7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MinGW (32 bits)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq g++-mingw-w64-i686-posix gcc-mingw-w64-i686-posix binutils-mingw-w64-i686 zip
      - name: Build CS Mix Clásico
        run: windows-classic/build.sh "${{ env.APP_VERSION }}"
      - name: Zip
        run: |
          mkdir -p "pkg/CS Mix Clasico"
          cp windows-classic/out/CSMixClasico.exe windows-classic/LEEME.txt "pkg/CS Mix Clasico/"
          cd pkg && zip -r "../CS-Mix-Clasico-Win7-${{ env.APP_VERSION }}.zip" "CS Mix Clasico"
      - uses: actions/upload-artifact@v4
        with:
          name: windows7
          path: CS-Mix-Clasico-Win7-*.zip

  release:
    needs: [android, windows, windows7]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ env.APP_VERSION }}" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "CS Mix ${{ env.APP_VERSION }}" \
            --notes "APK para Android, ZIP para Windows 10/11 (abrir CSMix.exe) y ZIP Clásico para Windows 7 de 32 o 64 bits (abrir CSMixClasico.exe)."
